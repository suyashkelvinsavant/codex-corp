name: Golden missions

# Mission-level golden regression gate (P2): builds the headless binary in a
# GTK-capable image, then runs every evals/golden/*.json mission end-to-end
# against the scripted fake app-server. Build needs webkit2gtk dev libs because
# the headless binary links the tauri/lib crate; RUNTIME needs no display.
# Fails on any mission regression (evals/runner.mjs exits non-zero).

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: golden-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install GTK-capable Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build codex-corp-headless
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin codex-corp-headless

      - name: Run golden missions
        run: node evals/runner.mjs
        env:
          CODEX_CORP_HEADLESS_BIN: ${{ github.workspace }}/src-tauri/target/debug/codex-corp-headless
